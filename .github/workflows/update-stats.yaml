name: Update README stats

on:
  schedule:
    - cron: "17 0 * * *" # 毎日 09:17（日本時間）
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-stats.yaml"

permissions:
  contents: write

concurrency:
  group: update-readme-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # コミット・pushにはGITHUB_TOKENを使用
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 統計取得にはPATを使用
      - name: Generate light stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=chrptos&show_icons=true&rank_icon=github&include_all_commits=true&hide_border=true&show=reviews,prs_merged,prs_merged_percentage
          path: profile/stats.svg
          token: ${{ secrets.GH_STATS_TOKEN }}
          fail_on_error: true

      - name: Generate dark stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=chrptos&theme=tokyonight&show_icons=true&rank_icon=github&include_all_commits=true&hide_border=true&bg_color=00000000&show=reviews,prs_merged,prs_merged_percentage
          path: profile/stats-dark.svg
          token: ${{ secrets.GH_STATS_TOKEN }}
          fail_on_error: true

      - name: Generate light languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs