name: Update README stats

on:
  schedule:
    - cron: "0 0 * * *" # 毎日 09:00（日本時間）
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-stats.yml"

permissions:
  contents: write

concurrency:
  group: update-readme-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Generate light stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=chrptos&show_icons=true&rank_icon=github&include_all_commits=true&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate dark stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=chrptos&theme=tokyonight&show_icons=true&rank_icon=github&include_all_commits=true&hide_border=true&bg_color=00000000
          path: profile/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/stats-dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update README stats"
          git pull --rebase origin main
          git push origin HEAD:main
